name: Build and Test

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: windows
            runner: windows-2022
          - os: macos
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(tr -d '\r\n' < VERSION)"
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Run CTest
        run: ctest --test-dir build -C Release --output-on-failure -j 4
      - name: Install, package and test extracted payload
        run: python scripts/package.py --build-dir build --output-dir dist --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: drcom-client-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 5

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure and build ASan/UBSan and fuzzers
        run: |
          cmake -S . -B build -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug -DDRCOM_SANITIZERS=address,undefined -DDRCOM_BUILD_FUZZERS=ON
          cmake --build build -j 4
      - name: Run instrumented tests
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure -j 4
      - name: Bounded fuzz smoke
        run: |
          mkdir -p /tmp/config-corpus /tmp/crypto-corpus
          cp config/*.conf /tmp/config-corpus/
          printf 'abc' > /tmp/crypto-corpus/seed
          build/fuzz_config /tmp/config-corpus -max_total_time=20 -timeout=5 -max_len=8192
          build/fuzz_crypto /tmp/crypto-corpus -max_total_time=20 -timeout=5 -max_len=8192

  create-release:
    runs-on: ubuntu-latest
    needs: [build, sanitizers]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: drcom-client-*
          merge-multiple: true
          path: dist
      - name: Verify all package checksums
        working-directory: dist
        run: sha256sum --check *.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
